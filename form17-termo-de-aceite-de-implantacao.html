:root{--navy:#181F37;--navy-2:#0F172A;--red:#EE1750;--slate-700:#334155;--slate-500:#64748B;--slate-400:#94A3B8;--slate-200:#E2E8F0;--slate-100:#F1F5F9;--slate-50:#F8FAFC;--c:#EF4444;--m:#F59E0B;--b:#10B981;--blue:#3B82F6;--radius:12px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:var(--navy-2);background:var(--slate-50);font-size:14px;line-height:1.5;-webkit-print-color-adjust:exact;print-color-adjust:exact}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}

/* ---------- Topbar / abas ---------- */
.topbar{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;display:flex;align-items:center;gap:20px;padding:10px 28px;flex-wrap:wrap}
.topbar img{height:44px;display:block}
.tb-title{border-left:1px solid rgba(255,255,255,.25);padding-left:20px}
.tb-title b{display:block;font-size:17px;line-height:1.2}
.tb-title span{font-size:12px;color:var(--slate-400)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.progress{min-width:170px}
.progress small{display:block;font-size:11px;color:var(--slate-400);margin-bottom:3px}
.bar{height:6px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--b);border-radius:99px;transition:width .25s}
.btn{border:1px solid var(--slate-200);background:#fff;color:var(--navy-2);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;font-size:13px;line-height:1.2;white-space:nowrap}
.btn:hover{background:var(--slate-100)}
.btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}
.btn.ghost:hover{background:rgba(255,255,255,.1)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none!important}
.btn.ghost.clr{color:#FCA5A5;border-color:rgba(252,165,165,.45)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.danger{color:#B91C1C}
.steps{position:sticky;top:64px;z-index:20;background:#fff;border-bottom:1px solid var(--slate-200);display:flex;gap:6px;padding:8px 28px;overflow-x:auto}
.steps a{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;color:var(--slate-700);text-decoration:none;font-weight:500;font-size:13px;white-space:nowrap}
.steps a:hover{background:var(--slate-100)}
.steps a b{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--navy);color:#fff;font-size:11px}
.steps a.on{background:var(--navy);color:#fff}.steps a.on b{background:var(--red)}
main{max-width:1240px;margin:0 auto;padding:24px 28px 80px}
section.card{display:none;background:#fff;border:1px solid var(--slate-200);border-radius:var(--radius);padding:24px;margin-bottom:22px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
section.card.on{display:block}
.sec-h{display:flex;align-items:center;gap:12px;margin-bottom:6px;flex-wrap:wrap}
.sec-h .n{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--navy);color:#fff;font-weight:700;font-size:13px}
.sec-h h2{font-size:18px}
.sec-sub{color:var(--slate-500);font-size:13px;margin-bottom:18px}
h3.sub{font-size:13px;margin:0 0 8px}

/* ---------- Campos ---------- */
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>span{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--slate-500)}
.f input,.f select,.f textarea{width:100%;padding:9px 11px;border:1px solid #CBD5E1;border-radius:8px;background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
.f textarea{resize:vertical;min-height:84px;overflow:hidden;line-height:1.45}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(24,31,55,.12)}
.invalid{border-color:var(--c)!important;background:#FEF2F2!important;box-shadow:0 0 0 3px rgba(239,68,68,.12)!important}
.grid3{display:grid;grid-template-columns:2fr 1fr;gap:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.hint{font-size:11.5px;color:var(--slate-500)}
.tbox{border:1px solid var(--slate-200);border-top:4px solid var(--tc,var(--slate-400));border-radius:10px;padding:14px;background:#fff;display:flex;flex-direction:column;gap:8px}
.tbox>h3{font-size:14px}
.pbox{border:1px solid var(--slate-200);border-left:4px solid var(--tc);border-radius:10px;padding:14px;background:#fff;display:flex;flex-direction:column;gap:8px}
.pbox>h3{font-size:14px;display:flex;align-items:center;gap:8px}
.pbox>h3 i{width:10px;height:10px;border-radius:50%;background:var(--tc);display:inline-block}
.mny{position:relative;display:block}
.mny input{width:100%;padding:9px 11px 9px 36px;border:1px solid #CBD5E1;border-radius:8px;background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
.mny input:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(24,31,55,.12)}
.mny::before{content:'R$';position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--slate-500);pointer-events:none}
.mny input{text-align:right}
.pct{position:relative}
.pct::after{content:'%';position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--slate-500);pointer-events:none}
.pct input{padding-right:28px;text-align:right}

/* ---------- Fila de responsáveis ---------- */
.teamadd{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end}
.teamadd .btn{height:40px}
.queue{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
.queue li{display:flex;align-items:center;gap:12px;border:1px solid var(--slate-200);border-radius:10px;padding:9px 12px;background:#fff}
.queue li.qe{color:var(--slate-400);font-size:12.5px;border-style:dashed;justify-content:center}
.qn{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;font-size:12px}
.qi{display:flex;flex-direction:column;min-width:0}.qi small{color:var(--slate-500);font-size:12px}
.qa{margin-left:auto;display:flex;gap:6px}
.qa .btn[disabled]{opacity:.35;cursor:default}

/* ---------- Alternativas ---------- */
.cen{border:1px solid var(--slate-200);border-top:4px solid var(--tc);border-radius:10px;padding:14px;background:#fff;display:flex;flex-direction:column;gap:10px}
.cen.rec{background:#F0FDF4;border-color:#86EFAC;border-top-color:var(--b)}
.cen h3{font-size:12px;color:var(--slate-500);text-transform:uppercase;letter-spacing:.05em}
.cen .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.badge-rec{display:none;align-self:flex-start;background:var(--b);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:2px 10px}
.cen.rec .badge-rec{display:inline-block}

/* ---------- Financeiro ---------- */
.fin{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:24px;align-items:start}
.costrow{display:grid;grid-template-columns:1fr 150px;gap:10px;align-items:center;margin-bottom:8px;font-size:13px}
.costrow.tot{border-top:1px solid var(--slate-200);padding-top:10px;font-weight:700}
.costrow .v{text-align:right}
.cfgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.kpi{border:1px solid var(--slate-200);border-top:3px solid var(--kc,var(--navy));border-radius:10px;padding:10px 13px}
.kpi small{display:block;color:var(--slate-500);font-size:11px}
.kpi b{font-size:20px;line-height:1.3;display:block}
.kpi em{font-style:normal;font-size:10.5px;color:var(--slate-400)}
.neg{color:var(--c)}.pos{color:#059669}
.chartbox{border:1px solid var(--slate-200);border-radius:10px;padding:12px}
.chartbox svg{display:block;width:100%;height:auto}
.empty{color:var(--slate-400);font-size:12.5px;padding:18px 0;text-align:center}

/* ---------- Aprovações ---------- */
.apr3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.abox{border:1px solid var(--slate-200);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px}

.stepnav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;padding-top:18px;border-top:1px solid var(--slate-200)}
.stepnav .btn{padding:10px 18px;font-size:13.5px}
.finish{display:flex;align-items:center;gap:18px;background:var(--navy);color:#fff;border-radius:var(--radius);padding:22px 26px;flex-wrap:wrap;margin-top:6px}
.finish b{font-size:16px;display:block}
.finish span{color:var(--slate-400);font-size:12.5px}
.finish .btn{margin-left:auto;font-size:15px;padding:12px 22px}

/* ---------- Modal ---------- */
#modal{position:fixed;inset:0;background:rgba(15,23,42,.6);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
#modal.on{display:flex}
.mdl{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:26px;box-shadow:0 25px 60px rgba(0,0,0,.35)}
.mdl h3{font-size:18px;margin-bottom:6px}
.mdl p{color:var(--slate-500);font-size:13px;margin-bottom:12px}
.mdl ul{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:6px;max-height:300px;overflow:auto}
.mdl li button{width:100%;text-align:left;border:1px solid var(--slate-200);background:var(--slate-50);border-radius:8px;padding:8px 11px;cursor:pointer;font-size:12.5px}
.mdl li button:hover{border-color:var(--c);background:#FEF2F2}
.mdl li b{color:var(--c)}
.mdl .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.ok-ic{width:46px;height:46px;border-radius:50%;background:var(--b);color:#fff;display:grid;place-items:center;font-size:24px;margin-bottom:10px}
.tips{background:var(--slate-50);border-radius:8px;padding:10px 14px;font-size:12px;color:var(--slate-700);margin-bottom:16px;list-style:none}
.tips li{margin:2px 0}

@media screen and (max-width:980px){
  .row2,.row3,.row4,.fin,.apr3,.grid3,.teamadd{grid-template-columns:1fr}
  main{padding:16px}.topbar,.steps{padding-left:16px;padding-right:16px}
}



.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chk{display:flex;gap:7px;align-items:center;border:1px solid var(--slate-200);border-radius:20px;padding:6px 13px;background:#fff;font-size:13px;cursor:pointer}
.chk input{width:15px;height:15px;margin:0}
.chk.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.grow input,.grow select,.grow textarea,.box input,.box textarea,.box select{width:100%;padding:8px 10px;border:1px solid #CBD5E1;border-radius:8px;background:#fff;outline:none;font:inherit}
.grow textarea,.box textarea{resize:none;overflow:hidden}
.grow input:focus,.grow select:focus,.grow textarea:focus,.box input:focus,.box textarea:focus,.box select:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(24,31,55,.12)}
.box label>span{display:block;font-size:11px;font-weight:600;color:var(--slate-500);margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em}
.blk{margin-bottom:26px}
.blk>.f,.blk>.g3{margin-bottom:14px}
.blk .sub{margin:0 0 4px;font-size:15px}
.blk>.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.g2s{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3s{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grow{display:grid;grid-template-columns:var(--cols);gap:8px;align-items:start;margin-bottom:8px}
.grow.hd{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--slate-500);margin-bottom:6px}
.memx{border:1px solid var(--slate-200);background:#fff;border-radius:8px;width:32px;height:34px;cursor:pointer;color:#B91C1C}
.tip{background:#F0F9FF;border:1px solid #BAE6FD;border-radius:10px;padding:10px 14px;font-size:12.5px;color:#075985;margin:0 0 14px;line-height:1.45}
.tip.warn{background:#FFFBEB;border-color:#FCD34D;color:#92400E}
.idc{display:inline-grid;place-items:center;background:var(--tc,var(--navy));color:#fff;font-weight:700;border-radius:7px;padding:3px 10px;font-size:12px;white-space:nowrap}
.sub2{margin:26px 0 4px;font-size:15px}
.addbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 14px}
.addbar .fl{font-size:12px;font-weight:600;color:var(--slate-500)}
.addbar .sp1{flex:1}
.fchip{border:1px solid #CBD5E1;background:#fff;border-radius:20px;padding:5px 12px;font:inherit;font-size:12.5px;cursor:pointer;color:var(--slate-500)}
.fchip b{margin-left:4px;background:#F1F5F9;border-radius:10px;padding:0 7px;color:var(--navy)}
.fchip.on{background:var(--navy);border-color:var(--navy);color:#fff}.fchip.on b{background:rgba(255,255,255,.2);color:#fff}
.tc{border:1px solid var(--slate-200);border-left:5px solid var(--tc);border-radius:12px;padding:16px 18px;background:#fff;margin-bottom:14px;display:grid;gap:12px}
.tc.hide{display:none}
.tc-h{display:flex;gap:12px;align-items:center}
.seg{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.sg{border:1px solid #CBD5E1;background:#fff;border-radius:20px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer;color:var(--slate-500)}
.sg:hover{border-color:var(--sc);color:var(--sc)}

};

  if(s.kind==='list')return h+`<div class="grow hd" style="--cols:${s.idCol?'62px ':''}${s.cols.map(c=>c.w||'1fr').map(w=>w==='1fr'?'minmax(0,1fr)':w).join(' ')} 34px">${s.idCol?'<span>ID</span>':''}${s.cols.map(c=>`<span>${esc(c.l)}</span>`).join('')}<span></span></div><div id="l-${s.k}"></div><button class="btn navy sm" type="button" data-act="add:${s.k}">${esc(s.add)}</button>`;

  if(s.kind==='decision')return h+`<div id="sg-${s.k}"></div><div class="big2" id="d-${s.k}"></div>`;
  if(s.kind==='text')return h+`<label class="f" style="margin-top:8px"><span>${esc(s.l)}${s.req?'':' <small class="hint">(opcional)</small>'}</span><textarea data-path="t.${s.k}" style="min-height:70px" placeholder="${esc(s.ph||'')}"></textarea></label>`;

  return '';

function ans(){

  });
  return o;
}
function sugOf(s){
  const all=ans();

/* ---------- Validação ---------- */
function validate(){
  const E=[];let total=0;
  const chk=(ok,msg,sel,tab)=>{total++;if(!ok)E.push({msg,sel,tab});};
  const P=p=>`[data-path="${p}"]`;
  const I=S.id;
  [['nome','o projeto'],['data','a data de criação'],['analista','quem elaborou o documento'],['versao','a versão do documento']].forEach(([k,l])=>chk(String(I[k]).trim(),`Informe ${l}.`,P('id.'+k),'s-proj'));
  const pend=$('#tNome')&&$('#tNome').value.trim();
  chk(S.team.length&&!pend,pend?`Clique em “+ Adicionar à fila” para incluir ${pend} nos responsáveis.`:'Adicione ao menos um responsável pela análise.',pend?'#btnTeamAdd':'#tNome','s-proj');
  [[C.tab2,'s-p2'],[C.tab3,'s-p3']].forEach(([t,tab])=>t.secs.forEach(s=>{
    if(s.kind==='fields')s.fields.forEach(f=>{if(f.req)chk(String(S.f[f.k]).trim(),`Informe ${f.l.toLowerCase()}.`,P('f.'+f.k),tab);});
    if(s.kind==='list'){
      const rows=S.l[s.k].map((r,i)=>[r,i]).filter(([r])=>!rowEmpty(s,r));
      if(s.req)chk(rows.length,`Cadastre ao menos um item em “${s.title}”.`,P(`l.${s.k}.0.${s.cols[0].k}`),tab);
      rows.forEach(([r,i])=>s.cols.forEach(c=>{if(c.reqIf?[].concat(c.reqIf.v).includes(r[c.reqIf.k]):c.req!==false)chk(String(r[c.k]).trim(),`${s.short||'Item'} ${i+1}: informe ${c.l.toLowerCase()}.`,P(`l.${s.k}.${i}.${c.k}`),tab);}));}
    if(s.kind==='checks')S.c[s.k].forEach((v,i)=>chk(v,`Responda: ${s.items[i]}`,`[data-ck="${s.k}"][data-i="${i}"]`,tab));
    if(s.kind==='decision'){chk(S.d[s.k],`Escolha: ${s.title}.`,`[data-dec="${s.k}"]`,tab);
      if(s.blockOk&&S.d[s.k]===s.sug.ok&&ans().includes('N'))chk(false,`A decisão “${s.sug.ok}” não é possível com itens não atendidos (marcados como “Não” ou pendentes). Resolva-os ou altere a decisão.`,`[data-dec="${s.k}"]`,tab);}
    if(s.kind==='text'){const hasN=ans().includes('N');
      if(s.req===true||(s.req==='N'&&hasN))chk(String(S.t[s.k]).trim(),s.req==='N'?'Há itens não atendidos (“Não” ou pendentes): descreva-os nas observações.':`Preencha: ${s.l}.`,P('t.'+s.k),tab);}
    if(s.kind==='signers')s.roles.forEach((r,i)=>chk(String(S.sg[i]).trim(),`Informe o nome: ${r.p}.`,P('sg.'+i),tab));
  }));
  return {E,total};
}

  if(s.kind==='fields'){
    const rows=[];for(let i=0;i<s.fields.length;i+=2){const a=s.fields[i],b=s.fields[i+1];rows.push(b&&!a.span&&!b.span?`<tr><th>${esc(a.l)}</th><td>${fv(a)}</td><th>${esc(b.l)}</th><td>${fv(b)}</td></tr>`:`<tr><th>${esc(a.l)}</th><td colspan="3">${fv(a)}</td></tr>${b?`<tr><th>${esc(b.l)}</th><td colspan="3">${fv(b)}</td></tr>`:''}`);}
    let note='';if(s.noteP){note=`<p class="note" style="margin:2mm 0 0;font-size:7.8pt;color:#334155">${esc(s.noteP.replace(/\{(\w+)\}/g,(m,k)=>{const f=s.fields.find(x=>x.k===k);return S.f[k]?(f&&f.type==='date'?fmtD(S.f[k]):S.f[k]):'__:__';}))}</p>`;}
    return `<div class="psec keep">${T}<table class="kv2">${rows.join('')}</table>${note}</div>`;}
  if(s.kind==='list'){
    const rows=S.l[s.k].filter(r=>!rowEmpty(s,r));if(!rows.length&&!s.req)return '';
    const cv=(c,r)=>c.badge&&r[c.k]?`<span class="pm" style="background:${c.badge[r[c.k]]||'#94A3B8'}">${esc(r[c.k])}</span>`:c.type==='date'?fmtD(r[c.k]):c.type==='time'?esc(r[c.k]):c.mono?`<span class="mono">${esc(r[c.k])}</span>`:nl2br(r[c.k]);
    return `<div class="psec">${T}<table class="dt"><colgroup>${s.idCol?'<col style="width:11mm">':''}${s.cols.map(c=>`<col${c.pw?` style="width:${c.pw}"`:''}>`).join('')}${s.box?'<col style="width:20mm">':''}</colgroup><thead><tr>${s.idCol?'<th>ID</th>':''}${s.cols.map(c=>`<th>${esc(c.l)}</th>`).join('')}${s.box?'<th class="c">Conferido</th>':''}</tr></thead><tbody>${rows.map((r,i)=>`<tr>${s.idCol?`<td><span class="idp">${String(i+1).padStart(2,'0')}</span></td>`:''}${s.cols.map(c=>`<td>${cv(c,r)||'—'}</td>`).join('')}${s.box?`<td class="c">${bx(false)}</td>`:''}</tr>`).join('')||`<tr><td colspan="${s.cols.length+(s.idCol?1:0)+(s.box?1:0)}">—</td></tr>`}</tbody></table></div>`;}
  if(s.kind==='checks')return `<div class="psec">${T}<table class="dt ckt"><colgroup><col><col style="width:16mm"><col style="width:16mm"><col style="width:16mm"></colgroup><thead><tr><th>Critério</th><th class="c">Sim</th><th class="c">Não</th><th class="c">N/A</th></tr></thead><tbody>${s.items.map((t,i)=>`<tr><td>${esc(t)}</td>${['S','N','NA'].map(v=>`<td class="c">${bx(S.c[s.k][i]===v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  if(s.kind==='decision'){const v=S.d[s.k],o=s.options.find(x=>x.v===v);return `<div class="psec keep">${T}<div class="verd" style="--vc:${o?o.c:'#94A3B8'}"><small>${esc(s.title)}</small><b>${esc((v||'—').toUpperCase())}</b></div></div>`;}
  if(s.kind==='kpis')return `<div class="psec keep">${T}<div class="g4" style="grid-template-columns:repeat(${s.items.length},1fr)">${s.items.map(id=>{const k=KPI[id]();return `<div class="pk" style="--kc:${k.c}"><small>${k.l}</small><b>${k.v}</b><em>${k.sub||''}</em></div>`;}).join('')}</div></div>`;
  if(s.kind==='text'){const v=S.t[s.k];if(!v.trim())return '';return `<div class="psec keep">${T}<div class="px" style="--tc:#F59E0B"><h4>${esc(s.l)}</h4><p>${txt(v)}</p></div></div>`;}
  if(s.kind==='term')return `<div class="psec keep">${T}<div class="px" style="--tc:${termWarn(s)?'#F59E0B':'#181F37'}"><p class="term">${nl2br(termText(s))}</p></div></div>`;
  if(s.kind==='signers')return `<div class="psec keep">${T}<div class="apr" style="grid-template-columns:repeat(${Math.min(s.roles.length,3)},1fr)">${s.roles.map((r,i)=>`<div class="apb"><b>${esc(S.sg[i])||'&nbsp;'}</b><span class="ck">${esc(r.p)}${r.s?' — '+esc(r.s):''}</span><span class="ck">Data: ___/___/______</span><div class="ln">Assinatura</div></div>`).join('')}</div></div>`;
  return '';
}
function buildPrint(){
  const I=S.id;
  const ident=`<h3 class="sec-t">Identificação do documento</h3><table class="kv2"><tr><th>Projeto</th><td colspan="3"><b>${esc(I.nome)||'—'}</b></td></tr>
    <tr><th>Data de criação</th><td>${fmtD(I.data)||'—'}</td><th>Elaborado por</th><td>${esc(I.analista)||'—'}</td></tr><tr><th>Versão do documento</th><td colspan="3">${esc(I.versao)||'—'}</td></tr></table>
    <h3 class="sec-t">Responsáveis pela análise</h3><table class="team" style="margin-bottom:5mm"><thead><tr><th style="width:7mm" class="c">Nº</th><th style="width:38%">Nome</th><th style="width:28%">Função / Área</th><th>Assinatura</th></tr></thead><tbody>${S.team.length?S.team.map((m,i)=>`<tr><td class="c">${i+1}</td><td><b>${esc(m.nome)}</b></td><td>${esc(m.func)}</td><td class="sig"></td></tr>`).join(''):'<tr><td colspan="4">Nenhum responsável informado.</td></tr>'}</tbody></table>`;
  let n=0;const body=SECS.map(s=>{if(s.title)n++;return printSec(s,n);}).join('');
  $('#print').innerHTML=`<table class="wrap"><thead><tr><td>${pageHead()}</td></tr></thead><tbody><tr><td>${ident}${body}
    <p class="note">Documento gerado em ${fmtD(localToday())} — ${CFG.form} | V.1, JCE SA Brazil.</p></td></tr></tbody></table>`;
  dirty=false;
}
function pruneRows(){SECS.forEach(s=>{if(s.kind==='list'){const k=S.l[s.k].filter(r=>!rowEmpty(s,r));if(k.length!==S.l[s.k].length){S.l[s.k]=k.length||!s.req?k:[blankRow(s)];renderList(s.k);}}});}
async function doPrint(draft){
  printedFlag=true;pruneRows();
  if(draft!==draftMode)draftMode=draft;
  buildPrint();
  await Promise.all($$('#print img').map(i=>i.decode?i.decode().catch(()=>{}):null));
  window.print();
}
function markDirty(){
  dirty=true;clearTimeout(dirtyTimer);
  const tryBuild=()=>{const a=document.activeElement;if(a&&a.tagName==='SELECT'){dirtyTimer=setTimeout(tryBuild,1500);return;}if(dirty)buildPrint();};
  dirtyTimer=setTimeout(tryBuild,1500);
}
['input','change'].forEach(ev=>document.addEventListener(ev,markDirty));
document.addEventListener('click',e=>{if(e.target.closest('button'))markDirty();});
(()=>{const i=new Image();i.id='preLogo';i.alt='';i.src=LOGO_D;i.style.cssText='position:absolute;width:1px;height:1px;opacity:0;pointer-events:none';i.className='screen';document.body.appendChild(i);})();
window.addEventListener('beforeprint',()=>{
  oldTitle=document.title;
  document.title=`${CFG.file} - ${S.id.nome||'Projeto'}`.replace(/[\\/:*?"<>|]/g,'-');
  if(dirty)buildPrint();
});
window.addEventListener('afterprint',()=>{document.title=oldTitle||document.title;});

/* ---------- Limpar tudo ---------- */
let printedFlag=false;
function resetAll(){
  S=makeState();draftMode=false;
  $('#tNome').value='';$('#tFunc').value='';
  fillAll();
  const b=$('#btnFinish');b.disabled=true;b.title='Disponível ao chegar na última etapa';
  dirty=true;buildPrint();showTab('s-proj');
}
function askClear(afterPrint){
  showModal(`${afterPrint?'<div class="ok-ic">✓</div>':''}<h3>${afterPrint?'PDF gerado. Limpar o formulário?':'Limpar tudo?'}</h3>
    <p>${afterPrint?'Se você salvou o PDF, pode zerar o formulário para um novo preenchimento. ':'Todos os dados preenchidos serão apagados. '}Se quiser guardar os dados para editar depois, salve um rascunho antes.</p>
    <div class="acts"><button class="btn" type="button" id="cKeep">${afterPrint?'Manter dados':'Cancelar'}</button><button class="btn navy" type="button" id="cSave">Salvar rascunho e limpar</button><button class="btn primary" type="button" id="cClear">Limpar tudo</button></div>`);
  $('#cKeep').onclick=closeModal;
  $('#cClear').onclick=()=>{closeModal();resetAll();};
  $('#cSave').onclick=()=>{$('#btnSave').click();closeModal();setTimeout(resetAll,400);};
}
$('#btnClear').onclick=()=>askClear(false);
window.addEventListener('afterprint',()=>{if(printedFlag){printedFlag=false;setTimeout(()=>askClear(true),400);}});

/* ---------- Início ---------- */
$('#tbLogo').src=LOGO_W;
buildTabs();buildStatic();$('#btnFinish').onclick=finish;$('#btnFinish2').onclick=finish;fillAll();showTab('s-proj');
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>buildPrint());
</script>
